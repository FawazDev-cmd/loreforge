services:
  loreforge:
    volumes:
      - ./src:/app/src
      - loreforge_hf_cache:/home/loreforge/.cache/huggingface
    environment:
      HF_HOME: /home/loreforge/.cache/huggingface
      TRANSFORMERS_CACHE: /home/loreforge/.cache/huggingface
    command: [ "uvicorn", "loreforge.main:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8000", "--reload" ]

volumes:
  loreforge_hf_cache:
